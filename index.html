<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMR Assistant</title>
<style>
  :root {
    --ink: #10130f;
    --paper: #eef0e4;
    --volt: #c8ff3d;
    --line: #2a2f26;
    --muted: #8b9280;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .frame {
    width: 100%; max-width: 460px; height: 88vh; max-height: 780px;
    background: var(--paper);
    border-radius: 18px;
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    border: 1px solid #000;
  }
  .head {
    background: var(--ink);
    color: var(--paper);
    padding: 20px 22px 18px;
    position: relative;
  }
  .head .tag {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--volt); font-weight: 700; margin-bottom: 6px;
  }
  .head h1 {
    margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.01em;
  }
  .head .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .pulse {
    position: absolute; top: 22px; right: 22px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--volt);
    box-shadow: 0 0 0 0 rgba(200,255,61,0.6);
    animation: ping 2s infinite;
  }
  @keyframes ping {
    0% { box-shadow: 0 0 0 0 rgba(200,255,61,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(200,255,61,0); }
    100% { box-shadow: 0 0 0 0 rgba(200,255,61,0); }
  }
  .messages {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 82%; font-size: 14.5px; line-height: 1.45; }
  .msg.bot {
    align-self: flex-start; background: #fff; color: var(--ink);
    padding: 11px 14px; border-radius: 4px 14px 14px 14px;
    border: 1px solid #d8dcc9;
  }
  .msg.user {
    align-self: flex-end; background: var(--ink); color: var(--volt);
    padding: 11px 14px; border-radius: 14px 4px 14px 14px;
    font-weight: 500;
  }
  .msg.typing { display: flex; gap: 4px; align-items: center; padding: 13px 16px; }
  .msg.typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    animation: bounce 1.2s infinite;
  }
  .msg.typing span:nth-child(2) { animation-delay: 0.15s; }
  .msg.typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }
  .quick { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 20px 14px; }
  .quick button {
    font-size: 12px; padding: 7px 11px; border-radius: 20px;
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    cursor: pointer; font-weight: 600;
  }
  .quick button:hover { background: var(--volt); border-color: var(--volt); }
  .composer {
    display: flex; gap: 8px; padding: 16px 18px 18px;
    border-top: 1px solid #d8dcc9; background: var(--paper);
  }
  .composer input {
    flex: 1; padding: 12px 14px; border-radius: 24px;
    border: 1px solid #c7cdb7; font-size: 14px; outline: none; background: #fff;
  }
  .composer input:focus { border-color: var(--ink); }
  .composer button {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--volt); color: var(--ink); font-weight: 900; font-size: 16px;
    cursor: pointer; flex-shrink: 0;
  }
  .composer button:disabled { opacity: 0.4; cursor: default; }
  .err { font-size: 12px; color: #b3392a; padding: 0 20px 10px; }
  .msg.bot ul { margin: 6px 0; padding-left: 18px; }
  .msg.bot li { margin: 3px 0; }
  .msg.bot strong { color: var(--ink); font-weight: 800; }
  .msg.bot table.md-table {
    border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px;
  }
  .msg.bot table.md-table th, .msg.bot table.md-table td {
    border: 1px solid #d8dcc9; padding: 6px 8px; text-align: left;
  }
  .msg.bot table.md-table th { background: #eef0e4; font-weight: 700; }
  .msg.bot h2, .msg.bot h3, .msg.bot h4 { margin: 8px 0 4px; line-height: 1.3; }
  .msg.bot h2 { font-size: 17px; }
  .msg.bot h3 { font-size: 15.5px; }
  .msg.bot h4 { font-size: 14.5px; }
  .msg.bot ol { margin: 6px 0; padding-left: 18px; }
  .msg.bot a { color: #5a7d1e; font-weight: 600; }
</style>
</head>
<body>

<div class="frame">
  <div class="head">
    <div class="pulse"></div>
    <div class="tag">GameX Studios</div>
    <h1>GAMR Assistant</h1>
    <div class="sub">Ask about the Play Pad, pre-orders, shipping</div>
  </div>

  <div class="messages" id="messages">
    <div class="msg bot">Hey! I'm the GAMR assistant. Ask me anything about the Play Pad — which version fits you, what's in the box, pre-order timing, whatever.</div>
  </div>

  <div class="quick" id="quick">
    <button onclick="ask('What\'s the difference between the Active, Rhythm, and Junior pads?')">Which pad is right for me?</button>
    <button onclick="ask('How much does it cost?')">Pricing</button>
    <button onclick="ask('What games work with GAMR?')">Compatible games</button>
  </div>

  <div class="err" id="err"></div>
  <div class="composer">
    <input type="text" id="input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()" id="sendBtn">→</button>
  </div>
</div>

<script>
// Note: no API key anywhere in this file. This just calls our own backend at /api/chat,
// which is the only place the real Gemini key lives (as a Vercel environment variable).

let history = [];

function ask(text) {
  document.getElementById('input').value = text;
  send();
}

function renderMarkdown(text) {
  // Escape HTML first to avoid injection
  let safe = text.replace(/\r\n/g, '\n');
  safe = safe.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // Tables (simple pipe-delimited markdown tables)
  const tableRegex = /(\|.+\|\n)(\|(?:\s*:?-+:?\s*\|)+\n)((?:\|.+\|\n?)+)/g;
  safe = safe.replace(tableRegex, (match, header, sep, body) => {
    const headerCells = header.trim().slice(1, -1).split('|').map(c => c.trim());
    const rows = body.trim().split('\n').map(r => r.trim().slice(1, -1).split('|').map(c => c.trim()));
    let html = '<table class="md-table"><thead><tr>';
    headerCells.forEach(c => html += '<th>' + c + '</th>');
    html += '</tr></thead><tbody>';
    rows.forEach(row => {
      html += '<tr>';
      row.forEach(c => html += '<td>' + c + '</td>');
      html += '</tr>';
    });
    html += '</tbody></table>';
    return html;
  });

  // Headings (###, ##, #) — check longest first
  safe = safe.replace(/(^|\n)### (.+)/g, '$1<h4>$2</h4>');
  safe = safe.replace(/(^|\n)## (.+)/g, '$1<h3>$2</h3>');
  safe = safe.replace(/(^|\n)# (.+)/g, '$1<h2>$2</h2>');

  // Links [text](url)
  safe = safe.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // Bold
  safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  // Numbered lists (1. 2. 3. ...)
  safe = safe.replace(/(^|\n)\d+\. (.+)/g, '$1<li>$2</li>');
  safe = safe.replace(/(<li>.*<\/li>\n?)+/g, (m) => {
    if (m.includes('OLMARK')) return m;
    return '<ol>' + m.replace(/\n/g, '') + '</ol>OLMARK';
  });
  safe = safe.replace(/OLMARK/g, '');

  // Bullet lists (lines starting with - or •)
  safe = safe.replace(/(^|\n)[-•] (.+)/g, '$1<li>$2</li>');
  safe = safe.replace(/(<li>.*<\/li>\n?)+/g, (m) => {
    if (m.startsWith('<ol>')) return m;
    return '<ul>' + m.replace(/\n/g, '') + '</ul>';
  });

  // Line breaks (only outside tables/lists/headings, keep it simple)
  safe = safe.replace(/\n{2,}/g, '<br><br>');
  safe = safe.replace(/\n/g, '<br>');

  return safe;
}

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (role === 'bot') {
    div.innerHTML = renderMarkdown(text);
  } else {
    div.textContent = text;
  }
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = 999999;
  return div;
}

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;

  document.getElementById('err').textContent = '';
  document.getElementById('quick').style.display = 'none';

  addMessage(text, 'user');
  history.push({ role: 'user', parts: [{ text: text }] });
  input.value = '';

  const typingDiv = document.createElement('div');
  typingDiv.className = 'msg bot typing';
  typingDiv.innerHTML = '<span></span><span></span><span></span>';
  document.getElementById('messages').appendChild(typingDiv);
  document.getElementById('messages').scrollTop = 999999;

  document.getElementById('sendBtn').disabled = true;

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ history })
    });

    const data = await response.json();
    typingDiv.remove();

    if (data.error) {
      addMessage('Error: ' + data.error, 'bot');
    } else {
      addMessage(data.reply, 'bot');
      history.push({ role: 'model', parts: [{ text: data.reply }] });
    }
  } catch (e) {
    typingDiv.remove();
    addMessage('Something went wrong reaching the server. Try again in a moment.', 'bot');
  }

  document.getElementById('sendBtn').disabled = false;
}
</script>

</body>
</html>
